[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "brokenlinkcrawler"
version = "0.1.0"
description = "Bounded, same-origin broken link crawler"
requires-python = ">=3.10"
license = "GPL-3.0-only"
dependencies = ["reportlab>=4.0"]
[project.scripts]
brokenlinkcrawler = "brokenlinkcrawler.cli:main"
[tool.setuptools.packages.find]
include = ["brokenlinkcrawler*"]
